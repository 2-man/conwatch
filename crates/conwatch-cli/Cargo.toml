[package]
name = "conwatch-cli"
description = "ConWatch command line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "conwatch_cli"
path = "src/lib.rs"

[[bin]]
name = "conwatch"
path = "src/main.rs"

[features]
wfp = ["conwatch-core/wfp"]

[dependencies]
conwatch-core = { path = "../conwatch-core" }
serde_json = "1"
tiny_http = "0.12"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
