[package]
name = "conwatch-core"
description = "ConWatch core: events, module API, network monitors"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
netstat2 = "0.11"
sysinfo = { version = "0.33", default-features = false, features = ["system", "network", "disk"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dns-lookup = "2"
maxminddb = "0.24"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
toml = "0.8"

[features]
# Experimental Windows Filtering Platform blocking (unverified, needs Administrator).
wfp = ["dep:windows"]

[target.'cfg(windows)'.dependencies]
ferrisetw = "1.2"
windows = { version = "0.58", optional = true, features = ["Win32_Foundation", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_System_Rpc", "Win32_Security", "Win32_Networking_WinSock", "Win32_NetworkManagement_IpHelper"] }
