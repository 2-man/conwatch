[workspace]
resolver = "2"
members = ["crates/conwatch-core", "crates/conwatch-cli", "crates/conwatch-app"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/2-man/conwatch"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
