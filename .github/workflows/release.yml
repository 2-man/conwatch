name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: conwatch-windows-x64.zip
          - os: macos-latest
            asset: conwatch-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/conwatch.exe,target/release/conwatch-app.exe,LICENSE,README.md,modules -DestinationPath ${{ matrix.asset }}
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" installer\conwatch.iss
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: zip -r ${{ matrix.asset }} target/release/conwatch target/release/conwatch-app LICENSE README.md modules
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            dist/*.exe
